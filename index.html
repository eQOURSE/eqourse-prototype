<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" />
    <meta name="google-site-verification" content="MjTY0z_vy1o8rvymS01fYJCNWIwjMiVXiWajOBHVYaI" />
    <style>
      html,
      body {
        margin: 0;
        background: #0f1223;
      }

      /* Keep non-home SEO fallbacks crawlable without flashing unstyled pages. */
      #root > main[data-seo-prerender="true"] {
        visibility: hidden;
      }

      /* The homepage can paint its real headline and poster before React loads. */
      #root > main[data-home-splash="true"] {
        visibility: visible;
        color: #fff;
        font-family: Inter, Arial, sans-serif;
      }
      .seo-home-nav {
        position: absolute;
        z-index: 2;
        inset: 0 0 auto;
      }
      .seo-home-contact {
        height: 40px;
        box-sizing: border-box;
        padding: 10px 36px;
        background: linear-gradient(90deg, #0d9488, #14b8a6);
        font-size: 12px;
        font-weight: 600;
      }
      .seo-home-nav nav {
        display: flex;
        align-items: center;
        gap: 36px;
        height: 64px;
        padding: 0 36px;
        background: rgba(15, 18, 35, .65);
        font-size: 14px;
      }
      .seo-home-nav img { width: 134px; height: 40px; object-fit: contain; margin-right: 28px; }
      .seo-home-nav a { color: #fff; text-decoration: none; }
      .seo-home-hero {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        overflow: hidden;
        background: #0f1223;
      }
      .seo-home-hero > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .seo-home-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(15, 18, 35, .86), rgba(15, 18, 35, .72) 45%, rgba(12, 62, 54, .65));
      }
      .seo-home-hero-content {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 7fr 5fr;
        align-items: center;
        gap: 40px;
        width: 100%;
        box-sizing: border-box;
        margin: auto;
        padding: 112px 36px 160px;
      }
      .seo-home-hero-copy > span {
        display: inline-block;
        padding: 8px 16px;
        border: 1px solid rgba(45, 212, 191, .3);
        border-radius: 999px;
        background: rgba(45, 212, 191, .13);
        color: #5eead4;
        font-size: 14px;
        font-weight: 600;
      }
      .seo-home-hero h1 {
        max-width: 770px;
        margin: 24px 0;
        font-size: clamp(2.25rem, 4.5vw, 3.75rem);
        font-weight: 800;
        line-height: 1.1;
      }
      .seo-home-hero h1 span { color: #14b8a6; }
      .seo-home-hero-copy > a {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 8px;
        background: #14b8a6;
        color: #0f1223;
        font-weight: 700;
        text-decoration: none;
      }
      .seo-home-services { font-size: 15px; }
      .seo-home-services > strong {
        display: block;
        margin-bottom: 28px;
        font-size: 24px;
        line-height: 1.2;
      }
      .seo-home-services > div {
        padding: 24px 0;
        border-top: 1px solid rgba(255, 255, 255, .18);
      }
      .seo-home-services b { display: block; margin-bottom: 10px; font-size: 20px; }
      .seo-home-services p { margin: 0; color: rgba(255, 255, 255, .7); line-height: 1.6; }
      @media (max-width: 900px) {
        .seo-home-nav nav a, .seo-home-contact, .seo-home-services { display: none; }
        .seo-home-nav nav { height: 64px; padding: 0 24px; }
        .seo-home-hero-content { display: block; padding: 120px 24px 100px; }
      }
      #root > main[data-home-splash="true"] > section:not(.seo-home-hero),
      #root > main[data-home-splash="true"] > p {
        max-width: 1100px;
        margin: auto;
        padding: 24px;
      }
    </style>

    <!--
      Primary SEO — fallbacks only, for the initial paint and for crawlers that
      do not execute JavaScript.

      The data-rh="true" attribute matters: react-helmet-async marks the tags it
      owns with data-rh, and on mount it REPLACES owned tags instead of appending
      to them. Without it, every route kept these homepage tags and appended its
      own, so each page shipped two titles and two descriptions and the generic
      homepage pair won. Do not remove data-rh from these tags.

      Every route-specific social tag is marked as Helmet-owned too, preventing
      a homepage fallback from remaining beside a CMS article's social tags.
    -->
    <title data-rh="true">AI Data Services &amp; Content Services Company | eQOURSE</title>
    <meta data-rh="true" name="description" content="eQOURSE provides AI data services for data collection, annotation, cleaning, validation, model testing and robotics, plus scalable content services for global teams." />
    <link data-rh="true" rel="canonical" href="https://www.eqourse.com/" />
    <meta name="author" content="eQOURSE" />
    <meta data-rh="true" name="keywords" content="eQOURSE, AI data services, AI data collection, data annotation, data cleaning, data validation, AI model testing, robotics training data, content services, e-learning content, curriculum development, India, Singapore" />

    <!-- Open Graph -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="eQOURSE" />
    <meta data-rh="true" property="og:title" content="AI Data Services &amp; Content Services Company | eQOURSE" />
    <meta data-rh="true" property="og:description" content="AI data collection, annotation, validation, model testing and scalable content services for global AI and learning teams." />
    <meta data-rh="true" property="og:url" content="https://www.eqourse.com/" />
    <meta data-rh="true" property="og:image" content="https://www.eqourse.com/assets/og-image.webp" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:site" content="@EQourse" />
    <meta data-rh="true" name="twitter:title" content="AI Data Services &amp; Content Services Company | eQOURSE" />
    <meta data-rh="true" name="twitter:description" content="AI data collection, annotation, validation, model testing and scalable content services for global AI and learning teams." />
    <meta data-rh="true" name="twitter:image" content="https://www.eqourse.com/assets/og-image.webp" />

    <!-- Favicon & Icons -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico" />
    <meta name="theme-color" content="#14B8A6" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Google Analytics -->
    <script async fetchpriority="low" src="https://www.googletagmanager.com/gtag/js?id=G-41GXR67XGE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-41GXR67XGE');
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
