<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block;position:absolute;inset:0;width:100%;height:100%}body{background:#FAF7EE}</style></head><body><canvas id="motionCanvas"></canvas><div hidden><div id="progress-bar"></div><div id="progress-knob"></div><span id="time-current"></span><span id="time-total"></span></div><script>
        /**
         * ANIMATION ENGINE & STYLUS RENDERER
         */
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d');

        // State Management
        let currentVariant = new URLSearchParams(location.search).get('variant') === 'html5' ? 'html5' : 'math'; // 'math' | 'html5'
        let paperTheme = 'light';    // 'light' (Yellowish Grid) | 'dark' (Navy Grid)
        let isPlaying = true;
        let animationSpeed = 1.0;
        let animationProgress = 0;   // 0 to 1
        let animationDuration = 8.0; // Seconds total cycle
        let lastTimestamp = 0;
        let animationFrameId = null;

        // Ink particles trailing stylus
        let particles = [];

        // --- MOTIF DEFINITIONS ---

        // VARIANT 1: Mathematics & Step-by-Step Problem Solving
        const MATH_MOTIF = {
            title: "Linear Equations • Mathematics • Pen Tab",
            duration: 8.5,
            steps: [
                // Header Label
                { type: 'text', text: "STEP-BY-STEP : Solve for x", x: 180, y: 85, size: 28, color: '#D97A0C', style: 'font-sans font-bold', delay: 0.0, dur: 0.8 },
                { type: 'line', points: [[180, 100], [520, 100]], color: '#F7941D', width: 3, delay: 0.8, dur: 0.4 },

                // Main Equation Step 1: 3x + 7 = 22
                { type: 'text', text: "3x + 7 = 22", x: 220, y: 190, size: 58, color: '#1E293B', delay: 1.3, dur: 1.8 },

                // Step 2 Action: Arrow down & Subtract 7
                { type: 'arrow', points: [[380, 215], [380, 260]], color: '#F7941D', width: 4, delay: 3.2, dur: 0.5 },
                { type: 'text', text: "- 7", x: 410, y: 245, size: 30, color: '#EF4444', delay: 3.7, dur: 0.4 },

                // Step 2 Equation: 3x = 15
                { type: 'text', text: "3x = 15", x: 220, y: 320, size: 58, color: '#1E293B', delay: 4.2, dur: 1.5 },

                // Strike through step 1
                { type: 'line', points: [[340, 150], [420, 210]], color: '#EF4444', width: 4, delay: 5.8, dur: 0.3 },

                // Step 3 Result: x = 5 with green check
                { type: 'text', text: "x = 5", x: 580, y: 250, size: 68, color: '#0F766E', delay: 6.2, dur: 1.0 },
                { type: 'box', x: 550, y: 175, w: 220, h: 120, color: '#F7941D', width: 4, delay: 7.2, dur: 0.6 },
                { type: 'checkmark', x: 800, y: 210, size: 40, color: '#10B981', width: 6, delay: 7.8, dur: 0.4 }
            ]
        };

        // VARIANT 2: Interactive HTML5 Modules & Visual Diagrams
        const HTML5_MOTIF = {
            title: "Interactive HTML5 • Concept Diagrams & Charts",
            duration: 8.5,
            steps: [
                // Header Label
                { type: 'text', text: "CONCEPT EXPLORER : Interactive Flow", x: 150, y: 75, size: 26, color: '#3B82F6', style: 'font-sans font-bold', delay: 0.0, dur: 0.8 },

                // Box 1: Input Data
                { type: 'box', x: 120, y: 130, w: 180, h: 90, color: '#0E1638', width: 4, delay: 0.8, dur: 0.8 },
                { type: 'text', text: "INPUT DATA", x: 145, y: 185, size: 26, color: '#1E293B', delay: 1.6, dur: 0.5 },

                // Connecting Arrow 1
                { type: 'arrow', points: [[300, 175], [420, 175]], color: '#F7941D', width: 4, delay: 2.1, dur: 0.5 },

                // Center Gear / Node Box
                { type: 'circle', cx: 500, cy: 175, r: 55, color: '#F7941D', width: 4, delay: 2.6, dur: 0.8 },
                { type: 'text', text: "HTML5", x: 462, y: 183, size: 28, color: '#D97A0C', delay: 3.4, dur: 0.4 },

                // Connecting Arrow 2
                { type: 'arrow', points: [[555, 175], [670, 175]], color: '#F7941D', width: 4, delay: 3.8, dur: 0.5 },

                // Lightbulb / Output Box
                { type: 'box', x: 670, y: 130, w: 210, h: 90, color: '#10B981', width: 4, delay: 4.3, dur: 0.8 },
                { type: 'text', text: "REALTIME UI", x: 690, y: 185, size: 26, color: '#0F766E', delay: 5.1, dur: 0.5 },

                // Bottom Bar Chart Sketch
                { type: 'line', points: [[150, 420], [850, 420]], color: '#64748B', width: 3, delay: 5.6, dur: 0.4 }, // X axis
                { type: 'rect_fill', x: 220, y: 320, w: 60, h: 100, color: '#3B82F6', delay: 6.0, dur: 0.4 },
                { type: 'rect_fill', x: 380, y: 270, w: 60, h: 150, color: '#F7941D', delay: 6.4, dur: 0.4 },
                { type: 'rect_fill', x: 540, y: 220, w: 60, h: 200, color: '#10B981', delay: 6.8, dur: 0.4 },

                // Growth Trend Arrow
                { type: 'arrow', points: [[200, 310], [620, 180]], color: '#EF4444', width: 4, delay: 7.3, dur: 0.6 },
                { type: 'text', text: "+145% Growth", x: 640, y: 175, size: 28, color: '#DC2626', delay: 7.9, dur: 0.5 }
            ]
        };

        // Get current active motif object
        function getActiveMotif() {
            return currentVariant === 'math' ? MATH_MOTIF : HTML5_MOTIF;
        }

        // Canvas Sizing setup
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);

        // Render Grid Background
        function drawBackground(w, h) {
            if (paperTheme === 'light') {
                // Warm Educational Paper background
                ctx.fillStyle = '#FAF7EE';
                ctx.fillRect(0, 0, w, h);

                // Grid lines
                ctx.strokeStyle = '#E8E3D3';
                ctx.lineWidth = 1;
                const gridSize = 32;

                ctx.beginPath();
                for (let x = 0; x < w; x += gridSize) {
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                }
                for (let y = 0; y < h; y += gridSize) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                }
                ctx.stroke();

                // Subtle red left margin line
                ctx.strokeStyle = '#FCA5A5';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(90, 0);
                ctx.lineTo(90, h);
                ctx.stroke();
            } else {
                // Navy Slate Dark Mode
                ctx.fillStyle = '#0E1638';
                ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = '#1E295D';
                ctx.lineWidth = 1;
                const gridSize = 36;

                ctx.beginPath();
                for (let x = 0; x < w; x += gridSize) {
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                }
                for (let y = 0; y < h; y += gridSize) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                }
                ctx.stroke();
            }
        }

        // Calculate point along straight line
        function interpolatePoint(p1, p2, t) {
            return [
                p1[0] + (p2[0] - p1[0]) * t,
                p1[1] + (p2[1] - p1[1]) * t
            ];
        }

        // Draw Stylus Pen
        function drawStylus(x, y, angle = -Math.PI / 4, isWriting = true) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;

            // Pen Tip (Nib)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-6, -18);
            ctx.lineTo(6, -18);
            ctx.closePath();
            ctx.fillStyle = isWriting ? '#F7941D' : '#64748B';
            ctx.fill();

            // Pen Metallic Collar
            ctx.fillStyle = '#94A3B8';
            ctx.fillRect(-7, -24, 14, 6);

            // Pen Shaft Body
            ctx.fillStyle = '#1E293B';
            ctx.beginPath();
            ctx.roundRect(-8, -120, 16, 96, [4, 4, 0, 0]);
            ctx.fill();

            // Orange Accent Ring
            ctx.fillStyle = '#F7941D';
            ctx.fillRect(-8, -105, 16, 6);

            // Pen Tip Glow when writing
            if (isWriting) {
                ctx.restore();
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#F7941D';
                ctx.shadowColor = '#F7941D';
                ctx.shadowBlur = 10;
                ctx.fill();

                // Add ink particle
                if (Math.random() < 0.4) {
                    particles.push({
                        x: x + (Math.random() - 0.5) * 4,
                        y: y + (Math.random() - 0.5) * 4,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.5,
                        life: 1.0,
                        color: '#F7941D'
                    });
                }
            }

            ctx.restore();
        }

        // Render Ink Particles
        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, 2 * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // Main Scene Drawing Logic
        function renderScene(currentTime) {
            const rect = canvas.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;

            // Scale coordinates from 1000x500 design base to actual screen size
            const scaleX = w / 1000;
            const scaleY = h / 500;

            drawBackground(w, h);

            const motif = getActiveMotif();
            let penPos = null;
            let penWriting = false;
            let penAngle = -Math.PI / 4;

            motif.steps.forEach(step => {
                if (currentTime < step.delay) return; // Not started yet

                // Progress ratio for this specific stroke (0..1)
                const stepProgress = Math.min(1.0, (currentTime - step.delay) / step.dur);
                const isStepActive = stepProgress > 0 && stepProgress < 1.0;

                // Color adjustment for Dark Mode
                let strokeColor = step.color;
                let textColor = step.color;
                if (paperTheme === 'dark') {
                    if (textColor === '#1E293B' || textColor === '#0E1638') textColor = '#F8FAFC';
                }

                ctx.save();

                // 1. TEXT STEP
                if (step.type === 'text') {
                    const charCount = step.text.length;
                    const visibleChars = Math.floor(charCount * stepProgress);
                    const displayText = step.text.substring(0, visibleChars);

                    const fontStyle = step.style || 'font-hand font-bold';
                    const fontSize = (step.size || 36) * Math.min(scaleX, scaleY);

                    ctx.font = `${fontSize}px ${fontStyle.includes('font-sans') ? 'Inter' : 'Caveat'}, cursive`;
                    ctx.fillStyle = textColor;
                    ctx.textBaseline = 'alphabetic';

                    const sx = step.x * scaleX;
                    const sy = step.y * scaleY;
                    ctx.fillText(displayText, sx, sy);

                    if (isStepActive && visibleChars > 0) {
                        const textMetrics = ctx.measureText(displayText);
                        penPos = [sx + textMetrics.width + 4, sy - fontSize * 0.3];
                        penWriting = true;
                    }
                }

                // 2. LINE / STROKE STEP
                else if (step.type === 'line' || step.type === 'arrow') {
                    const p1 = [step.points[0][0] * scaleX, step.points[0][1] * scaleY];
                    const p2 = [step.points[1][0] * scaleX, step.points[1][1] * scaleY];
                    const currentEnd = interpolatePoint(p1, p2, stepProgress);

                    ctx.beginPath();
                    ctx.moveTo(p1[0], p1[1]);
                    ctx.lineTo(currentEnd[0], currentEnd[1]);
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = (step.width || 3) * scaleX;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // Arrowhead if arrow type
                    if (step.type === 'arrow' && stepProgress >= 0.9) {
                        const angle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
                        const headLen = 14 * scaleX;
                        ctx.beginPath();
                        ctx.moveTo(p2[0], p2[1]);
                        ctx.lineTo(p2[0] - headLen * Math.cos(angle - Math.PI / 6), p2[1] - headLen * Math.sin(angle - Math.PI / 6));
                        ctx.moveTo(p2[0], p2[1]);
                        ctx.lineTo(p2[0] - headLen * Math.cos(angle + Math.PI / 6), p2[1] - headLen * Math.sin(angle + Math.PI / 6));
                        ctx.stroke();
                    }

                    if (isStepActive) {
                        penPos = currentEnd;
                        penWriting = true;
                        penAngle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]) - Math.PI / 3;
                    }
                }

                // 3. BOX STEP
                else if (step.type === 'box') {
                    const bx = step.x * scaleX;
                    const by = step.y * scaleY;
                    const bw = step.w * scaleX;
                    const bh = step.h * scaleY;

                    // Perimeter distance path
                    const perimeter = 2 * (bw + bh);
                    const currentDist = perimeter * stepProgress;

                    ctx.beginPath();
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = (step.width || 3) * scaleX;
                    ctx.lineCap = 'round';

                    let curPen = [bx, by];
                    ctx.moveTo(bx, by);

                    if (currentDist > 0) {
                        const d1 = Math.min(currentDist, bw);
                        ctx.lineTo(bx + d1, by);
                        curPen = [bx + d1, by];
                    }
                    if (currentDist > bw) {
                        const d2 = Math.min(currentDist - bw, bh);
                        ctx.lineTo(bx + bw, by + d2);
                        curPen = [bx + bw, by + d2];
                    }
                    if (currentDist > bw + bh) {
                        const d3 = Math.min(currentDist - bw - bh, bw);
                        ctx.lineTo(bx + bw - d3, by + bh);
                        curPen = [bx + bw - d3, by + bh];
                    }
                    if (currentDist > 2 * bw + bh) {
                        const d4 = Math.min(currentDist - 2 * bw - bh, bh);
                        ctx.lineTo(bx, by + bh - d4);
                        curPen = [bx, by + bh - d4];
                    }
                    ctx.stroke();

                    if (isStepActive) {
                        penPos = curPen;
                        penWriting = true;
                    }
                }

                // 4. CIRCLE STEP
                else if (step.type === 'circle') {
                    const cx = step.cx * scaleX;
                    const cy = step.cy * scaleY;
                    const r = step.r * scaleX;

                    const endAngle = stepProgress * Math.PI * 2;

                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, endAngle);
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = (step.width || 3) * scaleX;
                    ctx.stroke();

                    if (isStepActive) {
                        penPos = [cx + r * Math.cos(endAngle), cy + r * Math.sin(endAngle)];
                        penWriting = true;
                    }
                }

                // 5. RECT FILL (BAR CHART)
                else if (step.type === 'rect_fill') {
                    const rx = step.x * scaleX;
                    const ry = step.y * scaleY;
                    const rw = step.w * scaleX;
                    const rh = step.h * scaleY;

                    const currentH = rh * stepProgress;

                    ctx.fillStyle = strokeColor;
                    ctx.fillRect(rx, ry + rh - currentH, rw, currentH);

                    if (isStepActive) {
                        penPos = [rx + rw / 2, ry + rh - currentH];
                        penWriting = true;
                    }
                }

                // 6. CHECKMARK STEP
                else if (step.type === 'checkmark') {
                    const cx = step.x * scaleX;
                    const cy = step.y * scaleY;
                    const sz = step.size * scaleX;

                    ctx.beginPath();
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = (step.width || 4) * scaleX;
                    ctx.lineCap = 'round';

                    if (stepProgress < 0.4) {
                        const t = stepProgress / 0.4;
                        ctx.moveTo(cx, cy);
                        const end = interpolatePoint([cx, cy], [cx + sz * 0.3, cy + sz * 0.3], t);
                        ctx.lineTo(end[0], end[1]);
                        if (isStepActive) penPos = end;
                    } else {
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + sz * 0.3, cy + sz * 0.3);
                        const t = (stepProgress - 0.4) / 0.6;
                        const end = interpolatePoint([cx + sz * 0.3, cy + sz * 0.3], [cx + sz * 0.8, cy - sz * 0.5], t);
                        ctx.lineTo(end[0], end[1]);
                        if (isStepActive) penPos = end;
                    }
                    ctx.stroke();
                    if (isStepActive) penWriting = true;
                }

                ctx.restore();
            });

            // Update particle effects
            updateAndDrawParticles();

            // Draw Stylus at active drawing position
            if (penPos) {
                drawStylus(penPos[0], penPos[1], penAngle, penWriting);
            } else {
                // Resting stylus in bottom right corner when scene complete
                const restX = w - 80 * scaleX;
                const restY = h - 60 * scaleY;
                drawStylus(restX, restY, -Math.PI / 4, false);
            }
        }

        // Main Loop
        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            if (isPlaying) {
                const motif = getActiveMotif();
                animationDuration = motif.duration;

                // Increment overall progress
                animationProgress += (delta * animationSpeed) / animationDuration;

                // Loop reset
                if (animationProgress >= 1.0) {
                    animationProgress = 0;
                }

                // Sync UI progress bar & timer
                updateUIProgress();
            }

            // Render current frame
            const currentSceneTime = animationProgress * animationDuration;
            renderScene(currentSceneTime);

            animationFrameId = requestAnimationFrame(animate);
        }

        // Update UI Scrub Bar and Time Labels
        function updateUIProgress() {
            const progressBar = document.getElementById('progress-bar');
            const progressKnob = document.getElementById('progress-knob');
            const timeCurrent = document.getElementById('time-current');
            const timeTotal = document.getElementById('time-total');

            const pct = (animationProgress * 100).toFixed(2);
            progressBar.style.width = `${pct}%`;
            progressKnob.style.left = `${pct}%`;

            const curSec = Math.floor(animationProgress * animationDuration);
            const totSec = Math.floor(animationDuration);

            timeCurrent.textContent = `0:${curSec < 10 ? '0' : ''}${curSec}`;
            timeTotal.textContent = `0:${totSec < 10 ? '0' : ''}${totSec}`;
        }

        // Toggle Play/Pause State
        function togglePlayState() {
            isPlaying = !isPlaying;

            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const miniPlayIcon = document.getElementById('mini-play-icon');
            const miniPauseIcon = document.getElementById('mini-pause-icon');

            if (isPlaying) {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                miniPlayIcon.classList.remove('hidden');
                miniPauseIcon.classList.add('hidden');
            } else {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                miniPlayIcon.classList.add('hidden');
                miniPauseIcon.classList.remove('hidden');
            }
        }

        // Restart Current Animation Loop
        function restartAnimation() {
            animationProgress = 0;
            if (!isPlaying) togglePlayState();
        }

        // Handle Clicking Progress Scrub Bar
        function handleScrub(e) {
            const rect = document.getElementById('progress-container').getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            animationProgress = Math.max(0, Math.min(1, clickX / rect.width));
            updateUIProgress();
        }

        // Switch Variant Tabs
        function switchVariant(variant) {
            currentVariant = variant;
            animationProgress = 0;

            const tabMath = document.getElementById('tab-math');
            const tabHtml5 = document.getElementById('tab-html5');
            const badgeTitle = document.getElementById('badge-title');

            if (variant === 'math') {
                tabMath.className = "flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 bg-brandOrange text-white shadow-lg shadow-brandOrange/25 border border-brandOrange";
                tabHtml5.className = "flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 border border-slate-700";
                badgeTitle.textContent = MATH_MOTIF.title;
            } else {
                tabHtml5.className = "flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 bg-brandOrange text-white shadow-lg shadow-brandOrange/25 border border-brandOrange";
                tabMath.className = "flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 border border-slate-700";
                badgeTitle.textContent = HTML5_MOTIF.title;
            }
        }

        // Toggle Paper Theme (Grid Paper vs Dark Blueprint)
        function togglePaperTheme() {
            paperTheme = paperTheme === 'light' ? 'dark' : 'light';
            document.getElementById('theme-icon').textContent = paperTheme === 'light' ? '📄' : '🌙';
            document.getElementById('theme-text').textContent = paperTheme === 'light' ? 'Grid Paper' : 'Dark Slate';
        }

        // Cycle Speed (1.0x -> 1.5x -> 2.0x -> 0.5x)
        function cycleSpeed() {
            if (animationSpeed === 1.0) animationSpeed = 1.5;
            else if (animationSpeed === 1.5) animationSpeed = 2.0;
            else if (animationSpeed === 2.0) animationSpeed = 0.5;
            else animationSpeed = 1.0;

            document.getElementById('speed-btn-text').textContent = `${animationSpeed.toFixed(1)}x`;
            document.getElementById('speed-indicator').textContent = `${animationSpeed.toFixed(1)}x SPEED`;
        }

        // Copy Code Snippet Helper
        function copyMotifCode() {
            const snippet = `const myNewDiagram = [\n  { type: 'stroke', color: '#F7941D', points: [[100,200], [300,200]] },\n  { type: 'text', text: 'E = mc²', x: 320, y: 205, size: 36 },\n  { type: 'box', x: 80, y: 150, w: 350, h: 90 }\n];`;
            navigator.clipboard ? navigator.clipboard.writeText(snippet) : document.execCommand('copy');
            alert("Motif template JS copied to clipboard!");
        }

        // Initialize on Load
        window.onload = function() {
            resizeCanvas();
            animationFrameId = requestAnimationFrame(animate);
        };
    </script></body></html>
