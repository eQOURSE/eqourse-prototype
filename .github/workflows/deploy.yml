name: Deploy eQOURSE to Production

on:
  push:
    branches:
      - production
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            echo "🚀 Deploying eQOURSE Backend..."
            cd /opt/eqourse-prototype/eqourse-backend
            git -C /opt/eqourse-prototype fetch origin production
            git -C /opt/eqourse-prototype reset --hard origin/production
            npm install --production
            pm2 restart eqourse --update-env
            sleep 3
            pm2 list | grep eqourse | grep -v staging | grep -q "online" || { echo "❌ Backend not online!"; pm2 logs eqourse --lines 20; exit 1; }
            echo "✅ eQOURSE Backend deployed"

  build-and-deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          CMS_SEO_SOURCE_URL: ${{ secrets.CMS_SEO_SOURCE_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          CMS_SEO_OPTIONAL: "true"
        run: npm run build

      - name: Package build output
        run: tar -czf dist-output.tar.gz dist/

      - name: Pull latest code on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd /opt/eqourse-prototype
            git fetch origin production
            git reset --hard origin/production

      - name: Upload pre-built dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "dist-output.tar.gz"
          target: "/opt/eqourse-prototype"
          overwrite: true

      - name: Extract build and verify
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd /opt/eqourse-prototype
            chmod -R u+w dist 2>/dev/null || true
            rm -rf dist
            tar -xzf dist-output.tar.gz
            rm -f dist-output.tar.gz
            echo "✅ eQOURSE Frontend deployed"

  create-backup-tag:
    name: Create Backup Tag
    needs: [deploy-backend, build-and-deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          TAG="prod-$(date -u +'%Y.%m.%d-%H%M')"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "Production deploy: $TAG"
          git push origin "$TAG"
          echo "🏷️ Created backup tag: $TAG"
