# cdn.eqourse.com — Static asset delivery for events, brochures, and videos.
#
# Files are stored on the server at /var/www/eqourse-cdn/ and served directly
# by Nginx with aggressive caching headers. Cloudflare (if active) adds global
# CDN caching on top.
#
# Install: sudo cp cdn.eqourse.com.conf /etc/nginx/conf.d/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl http2;
    server_name cdn.eqourse.com;

    # SSL — use existing wildcard or Let's Encrypt cert
    # ssl_certificate     /etc/letsencrypt/live/eqourse.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eqourse.com/privkey.pem;

    root /var/www/eqourse-cdn;

    # CORS — allow the main site to embed assets
    add_header Access-Control-Allow-Origin "https://www.eqourse.com" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PDF files — long cache, inline preview
    location ~* \.pdf$ {
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "https://www.eqourse.com" always;
        try_files $uri =404;
    }

    # Video files — long cache, support range requests for seeking
    location ~* \.(mp4|webm|mov)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Accept-Ranges "bytes" always;
        add_header Access-Control-Allow-Origin "https://www.eqourse.com" always;
        try_files $uri =404;
    }

    # Images — long cache
    location ~* \.(webp|jpg|jpeg|png|svg|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "https://www.eqourse.com" always;
        try_files $uri =404;
    }

    # Documents — moderate cache
    location ~* \.(doc|docx|pptx|xlsx)$ {
        add_header Content-Disposition "inline" always;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "https://www.eqourse.com" always;
        try_files $uri =404;
    }

    # Default — deny directory listing, return 404 for unknown files
    location / {
        autoindex off;
        return 404;
    }
}
